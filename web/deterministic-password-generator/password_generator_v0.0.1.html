<!DOCTYPE html>
	<html>
		<head>
			<meta charset="UTF-8">
			<title>Deterministic Password Generator</title>
			<style>
				:root {
					--color-primary: #372580;
					--color-primary-bg: #ffffff;
					--color-primary-bg-hover: #f0edff;
					--color-page: #e5e7eb;
					--color-secondary-bg: #f6f7f9;
					--font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
					--radius-border: 1.5rem;
				}
				body {
					margin: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
					color: var(--color-primary);
					background: var(--color-primary-bg);
				}
				.topbar {
					position: sticky;
					top: 0;
					z-index: 10;
					display: flex;
					align-items: center;
					justify-content: space-between;
					padding: 14px 24px;
					background: var(--color-primary-bg);
				}
				.topbar-title {
					font-weight: 700;
					font-size: 18px;
					color: var(--color-primary);
				}
				.icon-btn {
					background: none;
					border: none;
					font-size: 20px;
					cursor: pointer;
					padding: 6px 10px;
					border-radius: 1000px;
					color: var(--color-primary);
					
				}
				.icon-btn:hover {
					background: var(--color-primary-bg-hover);
				}

				.page {
					background-color: var(--color-page);
					border-radius: var(--radius-border);
					margin: 1.5rem;
					padding: 1.5rem;
				}
				.box {
					border-radius: var(--radius-border);
					background: var(--color-secondary-bg);
					/* padding-top: var(--radius-border); */
					/* padding-bottom: var(--radius-border); */
					/* padding-left: var(--radius-border); */
					/* padding-right: var(--radius-border); */
				}
				.toolTitle {
					font-size: 1.25rem;
				}
				.textbox {
					border-radius: var(--radius-border);
					width: 100%;
					border-color: #372580;
					font-size: 1.5rem;
					padding: 0.5rem;
					/* margin: 1.5rem; */
				}

			</style>
		</head>

	<body>
		<header class="topbar">
			<div class="topbar-title">Deterministic Password Generator</div>
			<button type="button" id="settingsBtn" class="icon-btn" arial-label="Settings">Settings ⚙️</button>
		</header>
		<main class="page">
			<h1>Password Generator</h1>
			<div class="box">
				<label class="toolTitle">Master salt:</label><br>
				<input type="text" id="master" class="textbox"><br>

				<label>Pepper:<span>(a second short secret — same for a group of sites, e.g. "finance")</span>:</label><br>
				<input type="text" id="master" class="textbox"><br>
			
				<label>Website / Service:</label><br>
				<input type="text" id="site" class="textbox"><br>

				<label>Username / Email <span>(optional)</span>:</label><br>
				<input type="text" id="username" class="textbox"><br>
				<br>

				<label>Rotation counter:</label><br>
				<input type="number" id="counter" class="textbox" value="1" min="1"><br>
			</div>


			<h3>Or tap an emoji sequence:</h3>
			<div id="emojiCategoryTabs"></div>
			<div id="emojiGrid"></div>

			<button type="button" id="clearMaster">Clear</button>
			<button type="button" id="toggleMaster">Show / hide</button>

			<h3>Output parameters</h3>
			<label>password length: <span id="lengthDisplay">20 characters</span></label><br>
			<input type="range" id="length" min="8" max="64" value="20"><br>

			<input type="checkbox" id="" checked> <label for= useLowerCase>Lowercase letters (a-z)</label><br>
			<input type="checkbox" id="" checked> <label for= useUpperCase>Capital letters(A-Z)</label><br>
			<input type="checkbox" id="" checked> <label for= useDigits>Numbers (0-9)</label><br>
			<input type="checkbox" id="" checked> <label for= useSymbols>Symbols (!@#...)</label><br>
			<br>

			<button id="generateBtn">Generate</button>
			<p id="output" class="textbox"></p>
		</main>

		<script>
			const ALGORITHM = {
				version: "0.1.0", 
				createdDate: "2026-08-14",
				iterations: 250000,
				hashFunction: "SHA-256"
			};

			// Add invisible null character so salt never collides with real url. 
			function buildSalt(site, username, counter) {
				const normalizedSite = site.trim().toLowerCase();
				return `${normalizedSite}\u0000${username.trim()}\u0000${counter}`;
			}


			async function deriveBits(secret, saltText, iterations) {
				const enc = new TextEncoder();
				const keyMaterial = await crypto.subtle.importKey(
					'raw', enc.encode(secret), {name: 'PBKDF2'}, false, ['deriveBits']
				);
				const bits = await crypto.subtle.deriveBits(
					{name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(saltText), iterations }, keyMaterial, 256
				);
				return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
			}

			document.getElementById('generateBtn').addEventListener('click', async function() {
			const master = document.getElementById('master').value;
			const site = document.getElementById('site').value;
			const username = document.getElementById('username').value;
			const counter = document.getElementById('counter').value;

			document.getElementById('output').textContent = 'Working...';

			const salt = buildSalt(site, username, counter);
			const hex = await deriveBits(master, salt, ALGORITHM.iterations);

			document.getElementById('output').textContent = hex;
			});


			document.getElementById('length').addEventListener('input', function() {
				document.getElementById('lengthDisplay').textContent = `${this.value} characters`;
			})

			const EMOJI_CATEGORIES = {
				Animals: ['🐙','🦊','🐢','🐝','🦋','🐬','🦖','🐧','🦁','🐘','🦉','🐺','🦔','🐋','🦈'],
				Nature:  ['🌵','🌈','🍄','🌙','⚡','🌊','🔥','❄️','🌻','🍁','🌴','🪨','🌪️','☄️','🌋'],
				Food:    ['🍕','🍩','🍉','🍪','🥑','🍿','🍔','🍇','🥨','🍣','🧀','🍒','🥐','🍯','🥥'],
				Objects: ['🚀','🎸','🧊','🪁','🔑','🎩','⚙️','🧲','🔮','📡','🛸','🧭','🪄','🎲','🔔'],
				Symbols: ['🎯','🧩','🎪','⭐','💎','🔺','🎭','🧿','♟️','🎡','🎨','🧵','🔗','🪞','🎳']
			};

			function buildEmojiPicker(tabsElementId, gridElementId, targetInputId, categories) {
			const tabsContainer = document.getElementById(tabsElementId);
			const gridContainer = document.getElementById(gridElementId);
			const target = document.getElementById(targetInputId);
			const categoryNames = Object.keys(categories);

			function renderCategory(name) {
				gridContainer.innerHTML = ''; // wipe the previous category's buttons
				categories[name].forEach(function(emoji) {
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'emoji-btn';
				btn.textContent = emoji;
				btn.addEventListener('click', function() {
					target.value += emoji;
				});
				gridContainer.appendChild(btn);
				});
			}

			categoryNames.forEach(function(name, index) {
				const tabBtn = document.createElement('button');
				tabBtn.type = 'button';
				tabBtn.textContent = name;
				tabBtn.className = 'category-tab';
				tabBtn.addEventListener('click', function() {
				document.querySelectorAll('.category-tab').forEach(function(b) { b.style.fontWeight = 'normal'; });
				tabBtn.style.fontWeight = 'bold';
				renderCategory(name);
				});
				tabsContainer.appendChild(tabBtn);
				if (index === 0) tabBtn.style.fontWeight = 'bold'; // highlight first tab by default
			});

			renderCategory(categoryNames[0]); // show the first category right away
			}

			buildEmojiPicker('emojiCategoryTabs', 'emojiGrid', 'master', EMOJI_CATEGORIES);
		</script>
	</body>
</html>
