<!DOCTYPE html>
	<html>
		<head>
			<meta charset="UTF-8">
			<title>Deterministic Password Generator</title>
			<style>
				:root {
					--color-heading: #372580;
					--color-accent: #4a2dc5;
					--color-accent-bg-hover: #f0edff;
					--color-primary-bg: #ffffff;
					--color-page: #e5e7eb;
					--color-secondary-bg: #f6f7f9;
					--font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
					--radius-border: 1.5rem;
				}
				body {
					margin: 0;
					font-family: var(--font-sans);
					color: var(--color-heading);
					background: var(--color-primary-bg);
				}
				.topbar {
					position: sticky;
					top: 0;
					z-index: 10;
					display: flex;
					align-items: center;
					justify-content: space-between;
					padding: 14px 24px;
					background: var(--color-primary-bg);
				}
				.topbar-title {
					font-weight: 700;
					font-size: 18px;
					color: var(--color-heading);
				}
				.icon-btn {
					background: none;
					border: none;
					font-size: 20px;
					cursor: pointer;
					padding: 6px 10px;
					border-radius: 1000px;
					color: var(--color-heading);

				}
				.icon-btn:hover {
					background: var(--color-accent-bg-hover);
				}

				.page {
					background-color: var(--color-page);
					border-radius: var(--radius-border);
					margin: 1.5rem;
					padding: 1.5rem;
				}
				.box {
					box-sizing: border-box;
					border-radius: var(--radius-border);
					background: var(--color-secondary-bg);
					padding: 1.5rem;
					margin-bottom: 1.5rem;
				}
				.field-label {
					font-size: 1.25rem;
				}
				.textbox {
					box-sizing: border-box;
					border-radius: var(--radius-border);
					width: 100%;
					border: 2px solid var(--color-accent);
					outline: none;
					font-size: 1.5rem;
					padding: 0.5rem;
					overflow-wrap: break-word;
				}
				.textbox:focus {
					border-color: var(--color-accent);
					box-shadow: 0 0 0 2px var(--color-accent-bg-hover);
				}
				input[type="checkbox"] {
					width: 1.15rem;
					height: 1.15rem;
					accent-color: var(--color-accent);
					cursor: pointer;
					vertical-align: middle;
				}
				button {
					font: inherit;
					cursor: pointer;
					border: 2px solid var(--color-accent);
					border-radius: var(--radius-border);
					background: var(--color-accent);
					color: var(--color-primary-bg);
					padding: 0.5rem 1.25rem;
				}
				button:hover {
					background: var(--color-accent-bg-hover);
					color: var(--color-accent);
				}

				.meter-track {
					height: 0.75rem;
					border-radius: 1000px;
					background: #d8dae0;
					overflow: hidden;
					margin: 0.5rem 0;
				}
				.meter-fill {
					height: 100%;
					width: 0;
					border-radius: 1000px;
					transition: width 0.2s ease, background-color 0.2s ease;
				}
				.entropy-headline {
					font-size: 1.5rem;
					font-weight: 700;
				}
				.entropy-row {
					display: flex;
					justify-content: space-between;
					gap: 1rem;
					font-size: 0.95rem;
					margin-top: 0.35rem;
				}
				.entropy-note {
					font-size: 0.85rem;
					opacity: 0.75;
					margin-top: 0.75rem;
					line-height: 1.4;
				}

			</style>
		</head>

	<body>
		<header class="topbar">
			<div class="topbar-title">Deterministic Password Generator</div>
			<button type="button" id="settingsBtn" class="icon-btn" aria-label="Settings">Settings ⚙️</button>
		</header>
		<main class="page">
			<h1>Password Generator</h1>
			<div class="box">
				<label class="field-label" for="site">Website / Service:</label><br>
				<input type="text" id="site" name="site" class="textbox" autocomplete="off"><br>

				<label class="field-label" for="username">Username / Email <span>(optional)</span>:</label><br>
				<input type="text" id="username" name="username" class="textbox" autocomplete="username"><br>

				<label class="field-label" for="master">Master salt:</label><br>
				<input type="text" id="master" name="master" class="textbox" autocomplete="off"><br>

				<label class="field-label" for="pepper">Pepper:<span>(a second short secret — same for a group of sites, e.g. "finance")</span>:</label><br>
				<input type="text" id="pepper" name="pepper" class="textbox" autocomplete="off"><br>

				<label class="field-label" for="counter">Rotation counter:</label><br>
				<input type="number" id="counter" name="counter" class="textbox" value="1" min="1" autocomplete="off"><br>
			</div>


			<div class="box">
				<h3>Output parameters</h3>
				<label>password length: <span id="lengthDisplay">20 characters</span></label><br>
				<input type="range" id="length" min="8" max="64" value="20"><br>

				<input type="checkbox" id="useLowerCase" checked> <label for="useLowerCase">Lowercase letters (a-z)</label><br>
				<input type="checkbox" id="useUpperCase" checked> <label for="useUpperCase">Capital letters (A-Z)</label><br>
				<input type="checkbox" id="useDigits" checked> <label for="useDigits">Numbers (0-9)</label><br>
				<input type="checkbox" id="useSymbols" checked> <label for="useSymbols">Symbols (!@#...)</label><br>
			</div>

			<button id="generateBtn">Generate</button>
			<p id="output" class="textbox"></p>

			<div class="box">
				<h3>Strength</h3>
				<div class="entropy-headline"><span id="entropyBits">—</span> · <span id="entropyLabel">—</span></div>
				<div class="meter-track"><div id="entropyMeter" class="meter-fill"></div></div>
				<div class="entropy-row">
					<span id="entropyCharset">—</span>
					<span id="entropyCrack">—</span>
				</div>
				<p class="entropy-note" id="entropyNote"></p>
			</div>

			<div class="box">
				<h3>Algorithm self-test</h3>
				<p class="entropy-note" id="selfTestResult">Running…</p>
				<button type="button" id="selfTestBtn">Re-run self-test</button>
			</div>
		</main>

		<script>
			// ----------------------------------------------------------------------
			// ALGORITHM — every parameter that affects the output lives here.
			//
			// Like the alphabet below, these values ARE the algorithm: changing any
			// one of them changes every password this tool produces. Bump `version`
			// alongside any change so old passwords stay identifiable.
			//
			// KDF choice: PBKDF2 is the only password-stretching function WebCrypto
			// exposes (deriveBits supports PBKDF2, HKDF, ECDH, X25519 — no Argon2,
			// scrypt, or bcrypt). Memory-hard KDFs would resist GPU attack better, but
			// each needs a WASM dependency, which would cost this tool its single-file,
			// works-offline, nothing-to-trust property. PBKDF2 is also in every
			// language's standard library, so this algorithm stays reimplementable
			// long after any particular browser is gone.
			//
			// SHA-512 over SHA-256: not for the extra output width, which was already
			// far past reach, but for attacker asymmetry. SHA-256 is the most
			// ASIC-optimised function in existence thanks to Bitcoin mining, while
			// SHA-512's 64-bit words are comparatively awkward on cracking hardware.
			// Worth 1-2 bits, and free — WebCrypto supports it natively.
			//
			// 210,000 iterations is the OWASP floor for PBKDF2-HMAC-SHA512, calibrated
			// to roughly the same honest-user cost as 600,000 with SHA-256. Raising it
			// costs the live-preview responsiveness this UI depends on.
			//
			// derivedBits is 512 because a SHA-512 PRF yields that in a single PBKDF2
			// block, so it costs nothing — and at the top of the length slider a
			// 64-character password carries 413 bits, which a 256-bit key would cap.
			// ----------------------------------------------------------------------
			const ALGORITHM = {
				version: "0.3.0",
				createdDate: "2026-08-14",
				kdf: "PBKDF2-HMAC-SHA512",
				iterations: 210000,
				hashFunction: "SHA-512",
				derivedBits: 512,
				alphabet: 1
			};

			// A NUL byte can't occur in any field the user types, so joining with it
			// guarantees no two different field combinations build the same string.
			// Written as fromCharCode rather than an escape so the source file stays
			// plain readable text with no invisible characters in it.
			const FIELD_SEP = String.fromCharCode(0);

			// Unicode lets the same visible character be encoded more than one way:
			// "é" is either U+00E9, or "e" followed by a combining acute U+0301. They
			// look identical but hash differently, and which one you get depends on
			// your OS, keyboard and input method — so the same master typed on another
			// machine could silently derive a different password. NFC folds both to one
			// canonical form. NFC, not NFKC: the compatibility forms also rewrite "fi"
			// ligatures and fractions, which would merge characters we want kept apart.
			// Applied last, after trim/lowercase, since lowercasing can itself emit
			// decomposed output (U+0130 lowercases to "i" plus a combining dot).
			const normalize = (text) => text.normalize('NFC');

			// Both the live UI and the self-test build the secret through here, so the
			// two can never drift apart.
			function buildSecret(master, pepper) {
				return `${normalize(master)}${FIELD_SEP}${normalize(pepper)}`;
			}

			function buildSalt(site, username, counter) {
				const normalizedSite = normalize(site.trim().toLowerCase());
				return `${normalizedSite}${FIELD_SEP}${normalize(username.trim())}${FIELD_SEP}${counter}`;
			}


			// ----------------------------------------------------------------------
			// ALPHABETS — the exact characters each algorithm version can emit.
			//
			// These strings ARE part of the algorithm. derivePassword maps derived key
			// bytes onto them BY POSITION, so changing, adding, removing, or even
			// REORDERING one character changes every password that version has ever
			// produced. Never edit an existing entry: add a new numbered entry and
			// point ALGORITHM.alphabet at it, so old passwords stay reproducible.
			// ----------------------------------------------------------------------
			const ALPHABETS = {
				// 1 — added 2026-08-14. Paste-safe ASCII: 88 symbols, 6.4594 bits/char.
				1: {
					lower:   'abcdefghijklmnopqrstuvwxyz', // 26
					upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ', // 26
					digits:  '0123456789',                 // 10
					symbols: '!@#$%^&*()-_=+[]{};:,.<>?/', // 26  -> 88 total
					// Excluded on purpose, out of the 33 printable ASCII symbols:
					//   "  '  \  `  |  ~  and the space character.
					// They break shell/SQL/CSV/JSON quoting, or get silently trimmed
					// by login forms. Cost of omitting them is log2(95) - log2(88),
					// which is 0.11 bits per character.
					excluded: '"\'\\`|~ '
				}
			};

			const CHARSETS = ALPHABETS[ALGORITHM.alphabet];

			// A repeated character would be twice as likely to be picked, quietly
			// biasing the output, so surface it loudly instead of shipping skewed
			// passwords. Warn rather than throw: a dead script is the worse failure.
			(function verifyAlphabet() {
				const all = CHARSETS.lower + CHARSETS.upper + CHARSETS.digits + CHARSETS.symbols;
				if (new Set(all).size !== all.length) {
					console.error(`Alphabet ${ALGORITHM.alphabet} contains duplicate characters — output is biased.`);
				}
				const overlap = Array.from(CHARSETS.excluded).filter(c => all.includes(c));
				if (overlap.length) {
					console.error(`Alphabet ${ALGORITHM.alphabet} lists ${overlap.join(' ')} as both included and excluded.`);
				}
			})();

			const COLORS = {
				upper: '#10b981',
				digits: '#ecbe08',
				symbols: '#dc2626'
			};

			// Slow, expensive stretch of the master secret (+ pepper) into a derived key.
			async function deriveKeyBytes(secret, saltText, iterations) {
				const enc = new TextEncoder();
				const keyMaterial = await crypto.subtle.importKey(
					'raw', enc.encode(secret), {name: 'PBKDF2'}, false, ['deriveBits']
				);
				const bits = await crypto.subtle.deriveBits(
					{name: 'PBKDF2', hash: ALGORITHM.hashFunction, salt: enc.encode(saltText), iterations },
					keyMaterial, ALGORITHM.derivedBits
				);
				return new Uint8Array(bits);
			}

			// Cheap HMAC-based expansion of the stretched key into extra pseudorandom
			// bytes. Same hash as the KDF, so the whole algorithm is one primitive.
			async function hmacBlock(keyBytes, blockIndex) {
				const key = await crypto.subtle.importKey(
					'raw', keyBytes, {name: 'HMAC', hash: ALGORITHM.hashFunction}, false, ['sign']
				);
				const sig = await crypto.subtle.sign('HMAC', key, new Uint8Array([blockIndex]));
				return new Uint8Array(sig);
			}

			function buildCharset(options) {
				let charset = '';
				if (options.lower) charset += CHARSETS.lower;
				if (options.upper) charset += CHARSETS.upper;
				if (options.digits) charset += CHARSETS.digits;
				if (options.symbols) charset += CHARSETS.symbols;
				return charset;
			}

			// Maps the expanded byte stream onto the chosen charset via rejection sampling (avoids modulo bias).
			async function derivePassword(keyBytes, charset, length) {
				const threshold = Math.floor(256 / charset.length) * charset.length;
				const chars = [];
				let blockIndex = 0;
				let buffer = [];
				while (chars.length < length) {
					if (buffer.length === 0) {
						buffer = Array.from(await hmacBlock(keyBytes, blockIndex));
						blockIndex++;
					}
					const byte = buffer.shift();
					if (byte < threshold) {
						chars.push(charset[byte % charset.length]);
					}
				}
				return chars.join('');
			}

			// ----------------------------------------------------------------------
			// TEST_VECTORS — frozen known-good outputs for version 0.3.0.
			//
			// This is the tool's insurance policy. Every parameter above (iterations,
			// alphabet, separator, hash, sampling rule) feeds these results, so if any
			// of them is ever edited, or a browser ever changes behaviour underneath
			// us, the self-test fails immediately and visibly — instead of you finding
			// out when a password you generated years ago no longer opens your account.
			//
			// If you intentionally change the algorithm: bump ALGORITHM.version, then
			// recompute these. Never "fix" a failing vector by pasting in the new
			// output without understanding why it changed.
			// ----------------------------------------------------------------------
			const TEST_VECTORS = [
				{
					master: 'test', pepper: '', site: 'example.com', username: '', counter: '1',
					length: 20, options: { lower: true, upper: true, digits: true, symbols: true },
					expected: 'aQfMM)]U9C>YrCN-sTy,'
				},
				{
					master: 'test', pepper: 'finance', site: 'Example.COM ', username: 'alice', counter: '2',
					length: 16, options: { lower: true, upper: true, digits: true, symbols: false },
					expected: '24jljXKmtq9EO5fZ'
				},
				{
					master: 'æ日🐙', pepper: 'x', site: 'bank.example', username: 'bob@mail.test', counter: '1',
					length: 12, options: { lower: false, upper: false, digits: true, symbols: false },
					expected: '306463299593'
				},
				{
					// "cafe" + combining acute U+0301 — the decomposed spelling of
					// "café". NFC must fold it to the precomposed form, so this vector
					// only passes while normalization is in place. Built with
					// fromCharCode rather than an escape to keep the source plain text.
					master: 'cafe' + String.fromCharCode(0x0301), pepper: '',
					site: 'example.com', username: '', counter: '1',
					length: 16, options: { lower: true, upper: true, digits: true, symbols: true },
					expected: 'AKy6v8UwA??)aP/;'
				}
			];

			async function runSelfTest() {
				const el = document.getElementById('selfTestResult');
				el.textContent = 'Running…';
				const failures = [];
				try {
					for (const v of TEST_VECTORS) {
						const charset = buildCharset(v.options);
						const secret = buildSecret(v.master, v.pepper);
						const salt = buildSalt(v.site, v.username, v.counter);
						const keyBytes = await deriveKeyBytes(secret, salt, ALGORITHM.iterations);
						const actual = await derivePassword(keyBytes, charset, v.length);
						if (actual !== v.expected) {
							failures.push(`expected ${v.expected}, got ${actual}`);
						}
					}
				} catch (err) {
					el.style.color = COLORS.symbols;
					el.textContent = `Self-test could not run: ${err.message}`;
					return;
				}
				if (failures.length) {
					el.style.color = COLORS.symbols;
					el.textContent = `FAILED — this build no longer reproduces v${ALGORITHM.version} passwords. ${failures.join('; ')}`;
				} else {
					el.style.color = COLORS.upper;
					el.textContent = `Passed — ${TEST_VECTORS.length}/${TEST_VECTORS.length} vectors reproduce v${ALGORITHM.version} exactly (${ALGORITHM.kdf}, ${ALGORITHM.iterations.toLocaleString()} iterations, ${CHARSETS.lower.length + CHARSETS.upper.length + CHARSETS.digits.length + CHARSETS.symbols.length}-symbol alphabet ${ALGORITHM.alphabet}).`;
				}
			}

			function renderColoredPassword(password) {
				const output = document.getElementById('output');
				output.textContent = '';
				const frag = document.createDocumentFragment();
				for (const ch of password) {
					const span = document.createElement('span');
					span.textContent = ch;
					if (CHARSETS.upper.includes(ch)) span.style.color = COLORS.upper;
					else if (CHARSETS.digits.includes(ch)) span.style.color = COLORS.digits;
					else if (CHARSETS.symbols.includes(ch)) span.style.color = COLORS.symbols;
					frag.appendChild(span);
				}
				output.appendChild(frag);
			}

			const STRENGTH_TIERS = [
				{ min: 128, label: 'Excellent', color: '#10b981' },
				{ min: 80,  label: 'Strong',    color: '#10b981' },
				{ min: 60,  label: 'Fair',      color: '#ecbe08' },
				{ min: 40,  label: 'Weak',      color: '#f97316' },
				{ min: 0,   label: 'Very weak', color: '#dc2626' }
			];

			// Offline attack against a fast hash — the pessimistic assumption for a leaked site database.
			const GUESSES_PER_SECOND = 1e10;

			// Exact for our output: rejection sampling makes every character uniform over the charset.
			function passwordEntropyBits(length, charsetSize) {
				return length * Math.log2(charsetSize);
			}

			// Upper bound only. Human-chosen secrets contain patterns this can't see, so treat it as "no more than".
			function estimateSecretBits(secret) {
				const chars = Array.from(secret);
				if (!chars.length) return 0;
				let pool = 0;
				if (chars.some(c => /[a-z]/.test(c))) pool += 26;
				if (chars.some(c => /[A-Z]/.test(c))) pool += 26;
				if (chars.some(c => /[0-9]/.test(c))) pool += 10;
				if (chars.some(c => c.codePointAt(0) < 128 && /[^a-zA-Z0-9]/.test(c))) pool += 33;
				// Deliberately small pool for typed emoji or accented characters: the
				// estimate should err low rather than flatter a weak master.
				if (chars.some(c => c.codePointAt(0) > 127)) pool += 75;
				return pool ? chars.length * Math.log2(pool) : 0;
			}

			function tierFor(bits) {
				return STRENGTH_TIERS.find(t => bits >= t.min);
			}

			function formatCrackTime(bits) {
				const seconds = Math.pow(2, bits - 1) / GUESSES_PER_SECOND;
				if (seconds < 1) return 'instantly';
				if (seconds < 60) return `${Math.round(seconds)} seconds`;
				if (seconds < 3600) return `${Math.round(seconds / 60)} minutes`;
				if (seconds < 86400) return `${Math.round(seconds / 3600)} hours`;
				const years = seconds / 31556952;
				if (years < 1) return `${Math.round(seconds / 86400)} days`;
				const scales = [[1e18, 'quintillion'], [1e15, 'quadrillion'], [1e12, 'trillion'], [1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand']];
				for (const [value, name] of scales) {
					if (years >= value) {
						const scaled = years / value;
						return scaled < 1e4 ? `${scaled.toFixed(1)} ${name} years` : `10^${Math.floor(Math.log10(years))} years`;
					}
				}
				return `${Math.round(years)} years`;
			}

			function setEntropyDisplay(bitsText, label, color, fillPercent, charsetText, crackText, note) {
				document.getElementById('entropyBits').textContent = bitsText;
				document.getElementById('entropyLabel').textContent = label;
				document.getElementById('entropyCharset').textContent = charsetText;
				document.getElementById('entropyCrack').textContent = crackText;
				document.getElementById('entropyNote').textContent = note;
				const meter = document.getElementById('entropyMeter');
				meter.style.width = `${fillPercent}%`;
				meter.style.backgroundColor = color;
			}

			function resetEntropyDisplay(note) {
				setEntropyDisplay('—', '—', 'transparent', 0, '—', '—', note);
			}

			function updateEntropy(length, charsetSize, secret) {
				const bits = passwordEntropyBits(length, charsetSize);
				const tier = tierFor(bits);
				const secretBits = estimateSecretBits(secret);

				// The scheme can never be stronger than the derived key, nor than the secret behind it.
				const effective = Math.min(bits, ALGORITHM.derivedBits, secretBits);
				let note = `${length} chars from a ${charsetSize}-symbol alphabet: ${length} × log₂(${charsetSize}) = ${bits.toFixed(1)} bits.`;
				if (effective < bits) {
					note += ` Effective strength is capped at about ${effective.toFixed(0)} bits`;
					note += secretBits < ALGORITHM.derivedBits
						? ` — your master salt + pepper is the limit, not the output length. Attacking it costs ${ALGORITHM.iterations.toLocaleString()}× more per guess thanks to PBKDF2, but a short secret is still the weak link.`
						: ` by the ${ALGORITHM.derivedBits}-bit derived key.`;
				}

				setEntropyDisplay(
					`${bits.toFixed(1)} bits`,
					tier.label,
					tier.color,
					Math.min(100, (bits / 128) * 100),
					`alphabet: ${charsetSize} symbols`,
					`~${formatCrackTime(bits)} to crack`,
					note
				);
			}

			// Tolerate a missing control rather than throwing and killing the whole script.
			function fieldValue(id) {
				const el = document.getElementById(id);
				return el ? el.value : '';
			}

			function isChecked(id) {
				const el = document.getElementById(id);
				return el ? el.checked : false;
			}

			async function generateAndRender() {
				const output = document.getElementById('output');
				const master = fieldValue('master');
				const pepper = fieldValue('pepper');
				const site = fieldValue('site');
				const username = fieldValue('username');
				const counter = fieldValue('counter');
				const length = parseInt(fieldValue('length'), 10) || 20;
				const options = {
					lower: isChecked('useLowerCase'),
					upper: isChecked('useUpperCase'),
					digits: isChecked('useDigits'),
					symbols: isChecked('useSymbols')
				};

				if (!master) {
					output.textContent = 'Enter a master salt to generate a password…';
					resetEntropyDisplay('Waiting for a master salt.');
					return;
				}

				const charset = buildCharset(options);
				if (!charset) {
					output.textContent = 'Select at least one character type below.';
					resetEntropyDisplay('Select at least one character type to measure strength.');
					return;
				}

				const secret = buildSecret(master, pepper);
				updateEntropy(length, charset.length, secret);

				try {
					const salt = buildSalt(site, username, counter);
					const keyBytes = await deriveKeyBytes(secret, salt, ALGORITHM.iterations);
					const password = await derivePassword(keyBytes, charset, length);
					renderColoredPassword(password);
				} catch (err) {
					output.textContent = `Error: ${err.message}`;
				}
			}

			// Debounce so the PBKDF2 stretch doesn't run on every single keystroke.
			let debounceTimer = null;
			function scheduleGenerate() {
				document.getElementById('output').textContent = 'Working…';
				clearTimeout(debounceTimer);
				debounceTimer = setTimeout(generateAndRender, 300);
			}

			function listen(ids, eventName, handler) {
				ids.forEach(function(id) {
					const el = document.getElementById(id);
					if (el) el.addEventListener(eventName, handler);
				});
			}

			listen(['master', 'pepper', 'site', 'username', 'counter'], 'input', scheduleGenerate);
			listen(['useLowerCase', 'useUpperCase', 'useDigits', 'useSymbols'], 'change', scheduleGenerate);

			listen(['generateBtn'], 'click', function() {
				clearTimeout(debounceTimer);
				generateAndRender();
			});

			listen(['length'], 'input', function() {
				document.getElementById('lengthDisplay').textContent = `${this.value} characters`;
				scheduleGenerate();
			});

			listen(['selfTestBtn'], 'click', runSelfTest);

			generateAndRender();

			// Deferred so the vectors' PBKDF2 runs don't compete with first paint.
			setTimeout(runSelfTest, 500);

		</script>
	</body>
</html>
